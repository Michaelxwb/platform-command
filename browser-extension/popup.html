<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    body { width: 320px; margin: 0; padding: 14px; font: 12px/1.5 -apple-system, system-ui, "PingFang SC", sans-serif; color: #1f2937; background: #fff; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .status { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; flex: none; }
    .sub { color: #6b7280; font-weight: 400; }
    .path { color: #9ca3af; font-size: 11px; margin: 3px 0 12px; word-break: break-all; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    label .sub { font-weight: 400; }
    textarea, input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    textarea { height: 58px; resize: vertical; font-family: ui-monospace, monospace; }
    .grid { display: grid; grid-template-columns: 1fr 84px; gap: 8px; align-items: end; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 8px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
    #save { background: #2563eb; color: #fff; }
    #exportNow { background: #eef2ff; color: #3730a3; }
    button:active { transform: translateY(1px); }
    #toast { min-height: 16px; margin-top: 8px; font-size: 11px; color: #059669; }
  </style>
</head>
<body>
  <h1>platform-command 会话导出</h1>

  <div class="status"><span class="dot"></span><span id="stateText">监控中</span><span class="sub" id="lastExport"></span></div>
  <div class="path" id="outPath"></div>

  <label for="domains">监控域名 <span class="sub">每行一个 host，须与命令请求的 host 一致</span></label>
  <textarea id="domains" placeholder="linux.do"></textarea>

  <div class="grid">
    <div>
      <label for="filename">输出文件 <span class="sub">相对 Downloads</span></label>
      <input id="filename" type="text" placeholder="platform-command/storage-state.json" />
    </div>
    <div>
      <label for="minInterval">间隔/秒</label>
      <input id="minInterval" type="number" min="0" step="5" placeholder="60" title="两次下载最小间隔，挡轮换 cookie 频繁下载；立即导出不受限" />
    </div>
  </div>

  <div class="row">
    <button id="save">保存</button>
    <button id="exportNow">立即导出</button>
  </div>
  <div id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
