name: build-image

# 打 tag 推送时触发（如 git tag v0.4.0 && git push --tags）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

permissions:
  contents: read
  packages: write          # 推送 GHCR 需要

env:
  IMAGE: ghcr.io/michaelxwb/muad

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # amd64 runner，原生构建 amd64，无需 QEMU
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm pack 会触发 prepack（build + test）；测试不过则失败，作为发布闸门。
      # 产物 tgz 放进 deploy/pc-local/，供 Dockerfile 的 --pc-local 路径使用。
      - name: Build & pack platform-command
        run: |
          npm ci
          mkdir -p deploy/pc-local deploy/ga-local
          npm pack --pack-destination deploy/pc-local
          ls -la deploy/pc-local/*.tgz

      - name: Set up QEMU   # 跨架构（arm64）模拟构建所需
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag metadata
        id: meta
        run: |
          REF="${GITHUB_REF_NAME}"        # 触发的 git tag，如 v0.4.0
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"

      # ga-local/ 留空 → Dockerfile 走 git clone GA_REPO（默认作者 fork，公开仓库，含微信补丁）。
      # 双架构：amd64 原生快；arm64 在 amd64 runner 上走 QEMU 模拟，重镜像（GA pip + Playwright）
      # 较慢，若超时/OOM 改用原生 arm64 runner 的矩阵构建（见 README/CI 说明）。
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GA_REPO=https://github.com/Michaelxwb/GenericAgent
            GA_REF=main

      - name: Summary
        run: |
          echo "已推送：${IMAGE}:${{ steps.meta.outputs.tag }} 和 ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "服务器拉取：docker pull ${IMAGE}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
